training:
  base_model: "Qwen/Qwen2.5-7B-Instruct"
  output_dir: "models/llm/checkpoints"
  max_seq_length: 2048
  train_data_path: "data/sft/sft_train.jsonl"
  val_data_path: "data/sft/sft_val.jsonl"
  
  # Hyperparameters
  learning_rate: 2.0e-4
  num_train_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  warmup_ratio: 0.05
  weight_decay: 0.01
  logging_steps: 10
  save_strategy: "epoch"
  evaluation_strategy: "epoch"
  fp16: false
  bf16: true
  
  # LoRA Configuration
  lora:
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    target_modules:
      - "q_proj"
      - "k_proj"
      - "v_proj"
      - "o_proj"
      - "gate_proj"
      - "up_proj"
      - "down_proj"

