[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lifemate"
version = "0.1.0"
description = "LifeMate Speech & Tool-Use Agent for Zalo AI Challenge 2026"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0.1",
    "pydantic>=2.7.0",
    "tqdm>=4.66.0",
    "requests>=2.31.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
asr = [
    "torch>=2.2",
    "transformers>=4.40",
    "scipy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
